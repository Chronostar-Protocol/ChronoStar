name: Test Keeper

on:
  push:
    branches: [master]
    paths:
      - 'keeper/**'
  pull_request:
    paths:
      - 'keeper/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
        working-directory: keeper
      - run: npm run lint
        working-directory: keeper

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
        working-directory: keeper
      - run: npm test
        working-directory: keeper
      - run: npx c8 --reporter=text --reporter=lcov npm test
        working-directory: keeper
      - uses: actions/upload-artifact@v7
        with:
          name: keeper-coverage
          path: keeper/coverage
