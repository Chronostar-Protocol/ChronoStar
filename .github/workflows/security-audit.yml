name: Security Audit

on:
  schedule:
    - cron: '0 4 * * 1'
  pull_request:
    paths:
      - 'contract/Cargo.lock'
      - 'contract/Cargo.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'keeper/package.json'
      - 'backend/package.json'
      - 'frontend/package.json'
      - 'docs/package.json'
      - 'scripts/generate-license-inventory.js'

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - run: cargo install cargo-audit
      - run: cargo audit
        working-directory: contract

  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [keeper, backend, docs]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm audit
        working-directory: ${{ matrix.workspace }}

  license-compliance:
    name: Dependency License Inventory & Policy Check (#442)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate license inventory and verify compliance
        run: node scripts/generate-license-inventory.js
      - name: Upload dependency license inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-license-inventory
          path: |
            license-inventory.md
            license-inventory.json
