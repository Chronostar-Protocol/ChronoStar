name: Test Contracts

on:
  push:
    branches: [master]
    paths:
      - 'contract/**'
  pull_request:
    paths:
      - 'contract/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - run: cargo fmt --check
        working-directory: contract
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: contract

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - run: cargo test
        working-directory: contract
