name: Test Contracts

on:
  push:
    branches: [master]
    paths:
      - 'contract/**'
      - '.github/workflows/test-contracts.yml'
  pull_request:
    paths:
      - 'contract/**'
      - '.github/workflows/test-contracts.yml'

jobs:
  lint:
    name: Lint & Format (Standard Toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.84.0'
          target: wasm32-unknown-unknown
      - run: cargo fmt --check
        working-directory: contract
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: contract

  msrv:
    name: Verify Minimum Supported Rust Version (#449)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MSRV Rust toolchain (1.80.0)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.80.0'
          target: wasm32-unknown-unknown
      - name: Verify compilation on MSRV
        run: cargo check --target wasm32-unknown-unknown --release
        working-directory: contract

  test:
    name: Contract Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.84.0'
          target: wasm32-unknown-unknown
      - run: cargo test
        working-directory: contract
      - uses: taiki-e/install-action@cargo-tarpaulin
        continue-on-error: true
      - run: cargo tarpaulin --out Xml --timeout 120 || true
        working-directory: contract
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-coverage
          path: contract/cobertura.xml

  reproducible-wasm:
    name: Verify WASM Build Reproducibility (#444)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.84.0'
          target: wasm32-unknown-unknown

      - name: Perform Build A in clean workspace
        run: |
          mkdir -p build-a
          cp -r contract/* build-a/
          cd build-a
          cargo build --target wasm32-unknown-unknown --release

      - name: Perform Build B in clean workspace
        run: |
          mkdir -p build-b
          cp -r contract/* build-b/
          cd build-b
          cargo build --target wasm32-unknown-unknown --release

      - name: Compare WASM checksums between builds
        run: |
          echo "Comparing WASM build artifacts..."
          mkdir -p artifacts
          mismatch=0

          for wasm in schedule_vault recurring_stream dca_policy keeper_coordinator; do
            file_a="build-a/target/wasm32-unknown-unknown/release/${wasm}.wasm"
            file_b="build-b/target/wasm32-unknown-unknown/release/${wasm}.wasm"

            if [ ! -f "$file_a" ] || [ ! -f "$file_b" ]; then
              echo "::error::Missing WASM artifact for $wasm"
              mismatch=1
              continue
            fi

            hash_a=$(sha256sum "$file_a" | cut -d' ' -f1)
            hash_b=$(sha256sum "$file_b" | cut -d' ' -f1)
            size_a=$(stat -c%s "$file_a")
            size_b=$(stat -c%s "$file_b")

            echo "Contract: $wasm"
            echo "  Build A: $hash_a (${size_a} bytes)"
            echo "  Build B: $hash_b (${size_b} bytes)"

            if [ "$hash_a" != "$hash_b" ]; then
              echo "::error::Reproducibility mismatch on $wasm: $hash_a != $hash_b"
              mismatch=1
            else
              echo "  [PASS] Hashes match!"
              echo "$hash_a  ${wasm}.wasm" >> artifacts/contract-wasm-checksums.sha256
            fi
          done

          if [ $mismatch -ne 0 ]; then
            echo "::error::WASM build reproducibility check failed!"
            exit 1
          fi

          echo "All contract WASM artifacts built deterministically."

      - name: Upload reproducible WASM checksum manifest
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm-checksums
          path: artifacts/contract-wasm-checksums.sha256
  wasm-size-budget:
    name: Enforce Contract WASM Size Budgets (#438)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - name: Build optimized release contracts
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: contract
      - name: Verify WASM byte sizes against budgets
        run: node scripts/check-wasm-budget.js
      - name: Upload WASM size budget report
        uses: actions/upload-artifact@v4
        with:
          name: wasm-size-report
          path: |
            wasm-size-report.md
            wasm-size-report.json
