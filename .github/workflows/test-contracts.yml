name: Test Contracts

on:
  push:
    branches: [master]
    paths:
      - 'contract/**'
  pull_request:
    paths:
      - 'contract/**'

jobs:
  lint:
    name: Lint & Format (Standard Toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - run: cargo fmt --check
        working-directory: contract
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: contract

  msrv:
    name: Verify Minimum Supported Rust Version (#449)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MSRV Rust toolchain (1.80.0)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.80.0'
          target: wasm32-unknown-unknown
      - name: Verify compilation on MSRV
        run: cargo check --target wasm32-unknown-unknown --release
        working-directory: contract

  test:
    name: Contract Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - run: cargo test
        working-directory: contract
      - uses: taiki-e/install-action@cargo-tarpaulin
        continue-on-error: true
      - run: cargo tarpaulin --out Xml --timeout 120 || true
        working-directory: contract
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-coverage
          path: contract/cobertura.xml
