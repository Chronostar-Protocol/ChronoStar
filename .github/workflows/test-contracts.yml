name: Test Contracts

on:
  push:
    branches: [master]
    paths:
      - 'contract/**'
      - '.github/workflows/test-contracts.yml'
  pull_request:
    paths:
      - 'contract/**'
      - '.github/workflows/test-contracts.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - run: cargo fmt --check
        working-directory: contract
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: contract

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - run: cargo test
        working-directory: contract
      - uses: taiki-e/install-action@cargo-tarpaulin
        continue-on-error: true
      - run: cargo tarpaulin --out Xml --timeout 120 || true
        working-directory: contract
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-coverage
          path: contract/cobertura.xml

  wasm-size-budget:
    name: Enforce Contract WASM Size Budgets (#438)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - name: Build optimized release contracts
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: contract
      - name: Verify WASM byte sizes against budgets
        run: node scripts/check-wasm-budget.js
      - name: Upload WASM size budget report
        uses: actions/upload-artifact@v4
        with:
          name: wasm-size-report
          path: |
            wasm-size-report.md
            wasm-size-report.json
