name: Secret scan

on:
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository content
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo
          zricethezav/gitleaks:v8.21.2 detect --source . --no-git --redact --no-banner
