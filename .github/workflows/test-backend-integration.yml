name: Test Backend

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'contract/**'
      - 'scripts/seed.js'
      - '.github/workflows/test-backend-integration.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'contract/**'
      - 'scripts/seed.js'
      - '.github/workflows/test-backend-integration.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
        working-directory: backend
      - run: npm run lint
        working-directory: backend

  unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
        working-directory: backend
      - run: npm test
        working-directory: backend

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
        working-directory: backend
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-unknown-unknown
      - run: cargo build --release --target wasm32-unknown-unknown
        working-directory: contract
      - name: Install Stellar CLI
        uses: taiki-e/install-action@stellar-cli
      - name: Start local sandbox
        run: stellar container start local --limits unlimited
      - name: Wait for sandbox RPC health
        run: |
          for i in {1..60}; do
            STATUS=$(curl -s -X POST http://localhost:8000/soroban/rpc -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' | grep -o '"status":"healthy"' || true)
            if [ "$STATUS" = '"status":"healthy"' ]; then
              echo "Stellar sandbox is healthy"
              exit 0
            fi
            echo "Waiting for sandbox RPC..."
            sleep 2
          done
          echo "Timed out waiting for sandbox"
          exit 1
      - name: Run integration tests against a local sandbox
        run: npm run test:integration
        working-directory: backend
